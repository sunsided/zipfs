[package]
name = "zipfs"
version = "0.0.2"
edition = "2024"
rust-version = "1.87"
authors = ["Vivek Panyam <hello@vivekpanyam.com>"]
description = "An async filesystem on top of Zip files."
license = "Apache-2.0"
repository = "https://github.com/vivekpanyam/ZipFS"
keywords = ["filesystem", "vfs", "async", "zip", "lunchbox"]
categories = ["filesystem", "asynchronous", "compression"]

[dependencies]
# Pure-Rust decoders and checksums for the reader.
miniz_oxide = { version = "0.8", optional = true, default-features = false, features = ["with-alloc"] }
ruzstd = { version = "0.9", optional = true, default-features = false, features = ["std"] }
crc32fast = { version = "1.5", optional = true }
# The `lunchbox` feature: `ZipFS`, an async lunchbox filesystem.
lunchbox = { version = "0.1", optional = true, default-features = false }
async-trait = { version = "0.1", optional = true }
tokio = { version = "1", optional = true, default-features = false, features = ["io-util"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
# `ZipFS::from_file` and `FileSource` read archive files with tokio::fs and the blocking pool.
tokio = { version = "1", optional = true, default-features = false, features = ["fs", "rt"] }

[features]
default = ["deflate", "zstd", "crc32fast"]
# Decompress entries stored with the Deflate method (what most zip tools produce).
deflate = ["dep:miniz_oxide"]
# Decompress entries stored with the Zstandard method (pure Rust, also on WASI).
zstd = ["dep:ruzstd"]
# Compute CRC-32 checksums with the `crc32fast` crate (SIMD where available) instead of the
# built-in slicing-by-16 implementation.
crc32fast = ["dep:crc32fast"]
# Follow symlinks in every path component (`linked_dir/file.png`), not only the last one. As on
# a file system, `..` applies after following a link, and entries stored below a symlinked
# directory are shadowed by the link.
full-symlinks = []
# `ZipFS`: a read-only lunchbox filesystem over an archive in memory.
lunchbox = ["dep:lunchbox", "dep:async-trait", "dep:tokio"]
# With `default-features = false`, only stored (uncompressed) entries are supported and
# opening an archive containing anything else fails with `ErrorKind::Unsupported`.

[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
# Reference implementation for differential tests of the synchronous reader.
zip = { version = "7.3", default-features = false, features = ["deflate", "zstd"] }
