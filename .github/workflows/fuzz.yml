name: Fuzz

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Weekly longer run, Mondays 03:17 UTC.
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds to fuzz each target
        required: false
        default: "600"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - archive
          - slice
          - decompress
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal && rustup default nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked --version 0.13.1
      - name: cargo fuzz run
        env:
          TARGET: ${{ matrix.target }}
          EVENT: ${{ github.event_name }}
          REQUESTED_SECONDS: ${{ github.event.inputs.seconds }}
        run: |
          case "$EVENT" in
            schedule) seconds=1800 ;;
            workflow_dispatch) seconds="$REQUESTED_SECONDS" ;;
            *) seconds=60 ;;
          esac
          case "$seconds" in
            '' | *[!0-9]*) echo "invalid duration: $seconds" >&2; exit 1 ;;
          esac

          # The archive-level targets start from the seed archives and the zip dictionary;
          # `decompress` takes structured input and starts from scratch.
          inputs=()
          options=()
          if [ "$TARGET" != decompress ]; then
            inputs=(fuzz/seeds)
            options=(-dict=fuzz/zip.dict)
          fi
          mkdir -p "fuzz/corpus/$TARGET"
          cargo fuzz run "$TARGET" "fuzz/corpus/$TARGET" "${inputs[@]}" -- \
            "${options[@]}" -max_total_time="$seconds" -timeout=10 -rss_limit_mb=2048
      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 14
